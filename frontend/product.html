<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | VELOUR</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/product.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header & Navs identical -->
  <header class="header">
    <div class="header__inner">
      <div class="mobile-menu-btn" id="mobile-menu-btn"><span></span><span></span><span></span></div>
      <a href="index.html" class="header__logo">VELOUR</a>
      <nav class="header__nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop All</a>
      </nav>
      <div class="header__actions">
        <div id="header-auth" class="flex items-center gap-2"></div>
        <button id="cart-btn" class="icon-btn relative" title="Cart">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span class="badge badge-count cart-badge" style="display:none;position:absolute;top:-5px;right:-5px;">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Nav -->
  <nav id="mobile-nav" class="mobile-nav">
    <button id="mobile-nav-close" class="icon-btn mobile-nav__close"><svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
    <a href="index.html" class="nav-link">Home</a>
    <a href="shop.html" class="nav-link">Shop All</a>
  </nav>

  <!-- Cart Drawer -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-drawer__header"><span class="cart-drawer__title">Your Cart</span><button id="cart-drawer-close" class="icon-btn"><svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button></div>
    <div id="cart-drawer-body" class="cart-drawer__body"></div>
    <div id="cart-drawer-footer" class="cart-drawer__footer"></div>
  </div>

  <main class="main-content container" style="padding-bottom: 5rem;">
    <div class="breadcrumb" id="breadcrumb" style="margin-top:2rem">
      <a href="index.html">Home</a> <span>/</span> <a href="shop.html">Shop</a> <span>/</span> <span id="bc-name">Loading...</span>
    </div>

    <div class="product-layout" id="product-container" style="display:none;">
      <!-- Left -->
      <div>
        <div class="gallery-main">
          <img id="main-img" src="" alt="Product Image">
          <div id="badges-container" style="position:absolute;top:1rem;left:1rem;display:flex;flex-direction:column;gap:0.5rem"></div>
        </div>
        <div class="gallery-thumbs" id="thumbs-container"></div>
      </div>

      <!-- Right -->
      <div class="product-details">
        <h1 class="p-title" id="p-name"></h1>
        <div class="rating" id="p-rating"></div>
        
        <div class="p-price-row">
          <span class="p-price" id="p-price"></span>
          <span class="p-orig" id="p-orig" style="display:none"></span>
          <span class="badge badge-sale" id="p-discount" style="display:none"></span>
        </div>

        <p class="p-desc" id="p-desc"></p>

        <div style="margin-bottom:1.5rem">
          <div class="selector-label"><span>Select Size</span> <span id="size-val" class="text-primary"></span></div>
          <div class="size-grid" id="size-grid"></div>
        </div>

        <div style="margin-bottom:2rem">
          <div class="selector-label"><span>Select Color</span> <span id="color-val" class="text-primary"></span></div>
          <div class="color-swatches" id="color-grid"></div>
        </div>

        <div class="product-buy-row" style="margin-bottom:1rem">
          <div class="qty-control" style="flex-shrink:0">
            <button class="qty-btn" id="qty-dec-btn">−</button>
            <input type="text" class="qty-value" id="qty-input" value="1" readonly>
            <button class="qty-btn" id="qty-inc-btn">+</button>
          </div>
          <button class="btn btn-primary" style="flex:1" id="add-cart-btn">Add to Cart</button>
        </div>
        <button class="btn btn-secondary btn-full" id="add-wishlist-btn">Add to Wishlist</button>

        <div class="features-list">
          <div class="feature-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Premium Materials & Craftsmanship</div>
          <div class="feature-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Free Standard Shipping Over $100</div>
          <div class="feature-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> 30-Day Easy Returns</div>
        </div>
      </div>
    </div>

    <!-- Related -->
    <div style="margin-top:6rem">
      <h2 class="section-title text-center" style="margin-bottom:2rem">You May Also Like</h2>
      <div id="related-grid" class="products-grid"></div>
    </div>
  </main>

  <footer class="footer"><div class="container"><div class="footer__bottom"><div class="footer__copy">&copy; 2024 VELOUR.</div></div></div></footer>

  <!-- HTML Templates for UI Rendering -->
  <template id="product-card-template">
    <div class="product-card reveal">
      <div class="product-card__image-wrap">
        <img class="p-img" src="" alt="" loading="lazy">
        <div class="product-card__badges p-badges"></div>
        <div class="product-card__actions">
          <button class="icon-btn wishlist-toggle p-wishlist" title="Wishlist">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          </button>
        </div>
      </div>
      <div class="product-card__body">
        <div class="product-card__cat p-cat"></div>
        <div class="product-card__name p-name"></div>
        <div class="rating">
          <div class="stars p-stars"></div>
          <span class="rating-count p-reviews"></span>
        </div>
        <div class="product-card__pricing" style="margin-top:.5rem">
          <span class="product-card__price p-price"></span>
          <span class="product-card__original p-orig" style="display:none"></span>
        </div>
        <button class="product-card__add p-add">Quick Add</button>
      </div>
    </div>
  </template>

  <template id="cart-item-template">
    <div class="cart-item">
      <img class="cart-item__img ci-img" src="" alt="">
      <div class="cart-item__body">
        <div class="cart-item__name ci-name"></div>
        <div class="cart-item__meta ci-meta"></div>
        <div class="cart-item__footer">
          <div class="qty-control">
            <button class="qty-btn ci-qty-dec">−</button>
            <span class="qty-value ci-qty-val"></span>
            <button class="qty-btn ci-qty-inc">+</button>
          </div>
          <span class="cart-item__price ci-price"></span>
        </div>
      </div>
      <button class="icon-btn btn-icon ci-remove" style="align-self:flex-start;flex-shrink:0">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </template>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let product = null;
    let selectedSize = null;
    let selectedColor = null;
    let currentQty = 1;

    const COLOR_MAP = {
      'Midnight Black': '#0a0a0a', 'Jet Black': '#0a0a0a', 'Washed Black': '#1a1a1a', 'Black': '#000000', 'Black Wash': '#1c1c1c',
      'Charcoal': '#36454f', 'Slate Grey': '#708090', 'Smoke Grey': '#726d6a', 'Light Grey': '#d3d3d3', 'Grey': '#808080',
      'Ash Grey': '#b2beb5',
      'Cream White': '#f5f0e8', 'Bone White': '#f9f6f0', 'Bone': '#e3dac9', 'Cream': '#fffdd0', 'Ivory': '#fffff0',
      'Vintage White': '#f3e5ab', 'White': '#ffffff', 'Natural Canvas': '#e2d4c0',
      'Dusty Rose': '#dcae96', 'Terracotta': '#e2725b', 'Burgundy': '#800020',
      'Navy Void': '#000080', 'Navy': '#000080', 'Mid Indigo': '#4b0082', 'Dusty Blue': '#6699cc',
      'Olive': '#808000', 'Forest Green': '#228b22', 'Sage': '#9dc183',
      'Khaki': '#c3b091', 'Camel': '#c19a6b', 'Tan': '#d2b48c', 'Caramel': '#ffd59a', 'Onyx': '#353839'
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (!id) { window.location.href = 'shop.html'; return; }

      try {
        product = await api.getProduct(id);
        renderProduct();
        loadRelated();
      } catch (e) {
        Toast.error('Product not found');
        setTimeout(()=>window.location.href='shop.html', 2000);
      }
    });

    function renderProduct() {
      document.getElementById('product-container').style.display = 'grid';
      document.getElementById('bc-name').textContent = product.name;
      
      // Images
      const mainImg = document.getElementById('main-img');
      mainImg.src = product.images[0] || 'images/product_tshirt.png';
      
      const thumbsHtml = product.images.map((img, idx) => 
        `<div class="thumb ${idx===0?'active':''}" data-img="${img}"><img src="${img}"></div>`
      ).join('');
      document.getElementById('thumbs-container').innerHTML = thumbsHtml;

      // Badges
      let badges = '';
      if(product.is_new) badges += `<span class="badge badge-new">New</span>`;
      if(product.discount_pct) badges += `<span class="badge badge-sale">-${product.discount_pct}%</span>`;
      document.getElementById('badges-container').innerHTML = badges;

      // Details
      document.getElementById('p-name').textContent = product.name;
      document.getElementById('p-rating').innerHTML = renderStars(product.rating) + ` <span class="rating-count">(${product.review_count} reviews)</span>`;
      
      document.getElementById('p-price').textContent = `$${product.price.toFixed(2)}`;
      if (product.original_price) {
        const o = document.getElementById('p-orig'); o.style.display = 'inline'; o.textContent = `$${product.original_price.toFixed(2)}`;
        const d = document.getElementById('p-discount'); d.style.display = 'inline-flex'; d.textContent = `-${product.discount_pct}%`;
      }

      document.getElementById('p-desc').textContent = product.description;

      // Sizes
      if(product.sizes.length) {
        selectedSize = product.sizes[0];
        document.getElementById('size-val').textContent = selectedSize;
        document.getElementById('size-grid').innerHTML = product.sizes.map(s => 
          `<button class="size-btn ${s===selectedSize?'active':''}" data-size="${s}">${s}</button>`
        ).join('');
      }

      // Colors
      if(product.colors.length) {
        selectedColor = product.colors[0];
        document.getElementById('color-val').textContent = selectedColor;
        document.getElementById('color-grid').innerHTML = product.colors.map(c => {
          const hex = COLOR_MAP[c] || '#cccccc';
          return `<div class="color-swatch ${c===selectedColor?'active':''}" style="background-color:${hex}" title="${c}" data-color="${c}"></div>`;
        }).join('');
      }
    }

    function setMainImg(el, src) {
      document.getElementById('main-img').src = src;
      document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
    }
    
    function setSize(s) {
      selectedSize = s;
      document.getElementById('size-val').textContent = s;
      document.querySelectorAll('#size-grid .size-btn').forEach(b => {
        b.classList.toggle('active', b.textContent === s);
      });
    }

    function setColor(c) {
      selectedColor = c;
      document.getElementById('color-val').textContent = c;
      document.querySelectorAll('#color-grid .color-swatch').forEach(b => {
        b.classList.toggle('active', b.title === c);
      });
    }

    function adjustQty(d) {
      const n = currentQty + d;
      if(n >= 1 && n <= product.stock) {
        currentQty = n;
        document.getElementById('qty-input').value = n;
      }
    }

    async function addToCart() {
      if (!Auth.isLoggedIn()) { window.location.href='auth.html'; return; }
      const btn = document.getElementById('add-cart-btn');
      btn.textContent = 'Adding...'; btn.disabled = true;
      try {
        await api.addToCart({
          product_id: product.id, size: selectedSize, color: selectedColor, quantity: currentQty
        });
        await refreshCart();
        openCartDrawer();
        Toast.success('Added to cart');
      } catch(e) { Toast.error(e.message); }
      btn.textContent = 'Add to Cart'; btn.disabled = false;
    }

    async function toggleWish() {
      if (!Auth.isLoggedIn()) { window.location.href='auth.html'; return; }
      try {
        const res = await api.toggleWishlist(product.id);
        const added = res.product_ids.includes(product.id);
        document.getElementById('add-wishlist-btn').textContent = added ? 'Remove from Wishlist' : 'Add to Wishlist';
        Toast.success(added ? 'Added to wishlist' : 'Removed from wishlist');
      } catch(e) { Toast.error(e.message); }
    }

    async function loadRelated() {
      try {
        const res = await api.getProducts({ category: product.category, page_size: 4 });
        const related = res.products.filter(p => p.id !== product.id).slice(0,4);
        const relatedGrid = document.getElementById('related-grid');
        relatedGrid.innerHTML = '';
        related.forEach(p => relatedGrid.appendChild(renderProductCard(p)));
        initReveal();
      } catch(e) {}
    }

    // Event Delegation
    document.addEventListener('click', (e) => {
      // Thumbnails
      const thumb = e.target.closest('.thumb');
      if (thumb) {
        setMainImg(thumb, thumb.dataset.img);
      }
      
      // Sizes
      const sizeBtn = e.target.closest('.size-btn');
      if (sizeBtn) {
        setSize(sizeBtn.dataset.size);
      }

      // Colors
      const colorSwatch = e.target.closest('.color-swatch');
      if (colorSwatch) {
        setColor(colorSwatch.dataset.color);
      }
    });

    document.getElementById('qty-dec-btn')?.addEventListener('click', () => adjustQty(-1));
    document.getElementById('qty-inc-btn')?.addEventListener('click', () => adjustQty(1));
    document.getElementById('add-cart-btn')?.addEventListener('click', addToCart);
    document.getElementById('add-wishlist-btn')?.addEventListener('click', toggleWish);
  </script>
</body>
</html>
