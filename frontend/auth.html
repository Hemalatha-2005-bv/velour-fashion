<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth | VELOUR</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
  
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo" id="home-link" style="cursor:pointer">VELOUR</div>
      
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login">Sign In</div>
        <div class="auth-tab" id="tab-register">Create Account</div>
      </div>

      <!-- Login Panel -->
      <div id="login-panel" class="auth-panel active">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" id="log-email" required>
          </div>
          <div class="form-group">
            <div style="display:flex;justify-content:space-between">
              <label class="form-label">Password</label>
              <a href="#" class="text-sm text-primary" id="forgot-pwd-link">Forgot?</a>
            </div>
            <div class="input-group" style="position:relative">
              <input type="password" class="form-input" id="log-pwd" required style="padding-left:1rem;padding-right:2.5rem">
              <button type="button" class="icon-btn" id="toggle-log-pwd" style="position:absolute;right:4px;top:4px;width:30px;height:30px;background:none;border:none">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full" style="margin-top:1rem" id="login-btn">Sign In</button>
          
          <div class="divider"><span>Or continue with</span></div>
          <button type="button" class="btn btn-secondary btn-full" id="google-sso-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
        </form>
      </div>

      <!-- Register Panel -->
      <div id="register-panel" class="auth-panel">
        <form id="register-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" id="reg-name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" id="reg-email" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="reg-pwd" required>
            <div id="pwd-str" class="pwd-strength"><div class="pwd-bar"></div><div class="pwd-bar"></div><div class="pwd-bar"></div></div>
          </div>
          <div class="form-group" style="margin-bottom:1.5rem">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-input" id="reg-pwd2" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="reg-btn">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }
      
      // Bind Events
      document.getElementById('home-link')?.addEventListener('click', () => window.location.href='index.html');
      document.getElementById('tab-login')?.addEventListener('click', () => switchTab('login'));
      document.getElementById('tab-register')?.addEventListener('click', () => switchTab('register'));
      document.getElementById('login-form')?.addEventListener('submit', handleLogin);
      document.getElementById('register-form')?.addEventListener('submit', handleRegister);
      document.getElementById('forgot-pwd-link')?.addEventListener('click', (e) => { e.preventDefault(); Toast.info('Check your email to reset password'); });
      document.getElementById('toggle-log-pwd')?.addEventListener('click', () => togglePwd('log-pwd'));
      document.getElementById('google-sso-btn')?.addEventListener('click', () => Toast.info('Google SSO coming soon'));
      document.getElementById('reg-pwd')?.addEventListener('input', checkPwd);
    });

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      if(tab==='login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('login-panel').classList.add('active');
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('register-panel').classList.add('active');
      }
    }

    function togglePwd(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function checkPwd() {
      const val = document.getElementById('reg-pwd').value;
      const str = document.getElementById('pwd-str');
      str.className = 'pwd-strength';
      if(val.length === 0) return;
      if(val.length < 6) str.classList.add('pwd-weak');
      else if(val.length < 10) str.classList.add('pwd-fair');
      else str.classList.add('pwd-strong');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.textContent = 'Signing in...'; btn.disabled = true;
      try {
        const res = await api.login({
          email: document.getElementById('log-email').value,
          password: document.getElementById('log-pwd').value
        });
        Auth.setSession(res.access_token, res.user);
        const urlParams = new URLSearchParams(window.location.search);
        window.location.href = urlParams.get('next') || 'index.html';
      } catch (err) {
        Toast.error(err.message);
        btn.textContent = 'Sign In'; btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const pwd = document.getElementById('reg-pwd').value;
      if(pwd !== document.getElementById('reg-pwd2').value) {
        return Toast.error('Passwords do not match');
      }
      if(pwd.length < 6) {
        return Toast.error('Password must be at least 6 characters');
      }
      
      const btn = document.getElementById('reg-btn');
      btn.textContent = 'Creating...'; btn.disabled = true;
      try {
        const res = await api.register({
          name: document.getElementById('reg-name').value,
          email: document.getElementById('reg-email').value,
          password: pwd
        });
        Auth.setSession(res.access_token, res.user);
        window.location.href = 'index.html';
      } catch (err) {
        Toast.error(err.message);
        btn.textContent = 'Create Account'; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
